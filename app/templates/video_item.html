{% extends "base.html" %}
{% block title %}{{ item.title }} — Видео{% endblock %}
{% block content %}
<div class="read-head">
  <a class="btn" href="/video">← К видео</a>
  <span class="lvl-badge">{{ item.cefr_level }}</span>
</div>
<h1>{{ item.title }}</h1>

<div class="video-embed">
  <iframe src="https://www.youtube.com/embed/{{ youtube }}" title="{{ item.title }}"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen></iframe>
</div>

<form method="post" action="/video/{{ item.id }}/reflect" class="form-card" style="margin-top:20px">
  <label>Посмотрел? Напиши <b>1–2 предложения по-английски</b> о ролике — о чём он / что понравилось.
    <textarea name="text" rows="3" required minlength="10"
      placeholder="e.g. This video is about a bus. The wheels go round and round. I liked the song."></textarea></label>
  <button class="btn primary big-btn" type="submit">Готово</button>
  <p class="muted" style="margin-top:8px;font-size:.85rem">Не нужно точно — просто пару фраз своими словами, по-английски.</p>
</form>
{% endblock %}
