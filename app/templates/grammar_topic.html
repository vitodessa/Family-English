{% extends "base.html" %}
{% block title %}{{ topic.name }} — Грамматика{% endblock %}
{% block content %}
<div class="read-head">
  <a class="btn" href="/grammar">← Темы</a>
  <span class="lvl-badge">{{ current_user.cefr_level }}</span>
</div>
<h1>{{ topic.name }}</h1>

<div class="card" style="margin-top:12px">
  <p class="pre">{{ theory }}</p>
</div>

<div class="cta" style="justify-content:flex-start;margin-top:20px">
  <a class="btn primary big-btn" href="/grammar/{{ topic.id }}/practice">Практика →</a>
  <a class="btn" href="/grammar">К темам</a>
</div>
{% endblock %}
