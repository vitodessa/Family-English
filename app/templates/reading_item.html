{% extends "base.html" %}
{% block title %}{{ item.title }} — Чтение{% endblock %}
{% block content %}
<div class="read-head">
  <a class="btn" href="/reading">← К текстам</a>
  <span class="lvl-badge">{{ item.cefr_level }}</span>
</div>
<h1>{{ item.title }}</h1>

<div id="text" class="reader-text">{{ item.body }}</div>
<p class="muted center" style="margin-top:16px">
  Наведи на слово — увидишь перевод. Кликни — слово уйдёт в карточки на запоминание.
</p>

<div id="tip" class="wtip" hidden>
  <button id="tip-audio" class="audio-btn" type="button" title="Послушать">🔊</button>
  <span id="tip-tr" class="wtip-tr">…</span>
</div>
<div id="toast" class="rtoast"></div>

<script>
(function(){
  const textEl = document.getElementById('text');
  const body = textEl.textContent.trim();
  // разбиваем текст на слова-спаны (безопасно, через textContent)
  const raw = textEl.textContent;
  textEl.textContent = '';
  (raw.match(/[A-Za-z']+|[^A-Za-z']+/g) || []).forEach(p => {
    if(/[A-Za-z]/.test(p)){ const s=document.createElement('span'); s.className='w'; s.textContent=p; textEl.appendChild(s); }
    else textEl.appendChild(document.createTextNode(p));
  });

  const tip=document.getElementById('tip'), tipTr=document.getElementById('tip-tr'),
        tipAudio=document.getElementById('tip-audio'), toast=document.getElementById('toast');
  const canHover = window.matchMedia('(hover: hover)').matches;
  const cache = {};                 // слово → перевод (чтобы не дёргать API повторно)
  let showTimer=null, hideTimer=null, shownFor=null, tipWordText='';

  function speak(w){ try{ const u=new SpeechSynthesisUtterance(w); u.lang='en-US';
    speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
  tipAudio.onclick = e => { e.stopPropagation(); speak(tipWordText); };

  function flash(msg){ toast.textContent=msg; toast.classList.add('show');
    clearTimeout(flash._t); flash._t=setTimeout(()=>toast.classList.remove('show'), 1600); }

  function showTip(span){
    const word = span.textContent; tipWordText = word;
    tipTr.textContent = (cache[word] !== undefined && cache[word] !== null) ? (cache[word] || '—') : '…';
    tip.hidden = false; shownFor = span;
    const r = span.getBoundingClientRect();
    tip.style.left = Math.max(8, window.scrollX + r.left) + 'px';
    tip.style.top  = (window.scrollY + r.bottom + 6) + 'px';
    if(cache[word] === undefined){
      cache[word] = null;   // «в полёте»
      fetch('/reading/translate', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({word, sentence: body})})
        .then(r => r.json()).then(d => {
          cache[word] = d.error ? '' : (d.translation || '');
          if(shownFor === span) tipTr.textContent = cache[word] || '—';
        }).catch(() => { cache[word] = ''; if(shownFor === span) tipTr.textContent = 'ошибка'; });
    }
  }
  function hideTip(){ tip.hidden = true; shownFor = null; }

  function addWord(span){
    const word = span.textContent;
    const tr = cache[word];
    if(!tr){ showTip(span); return; }   // перевода ещё нет — сперва покажем
    fetch('/reading/add-word', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({word, translation: tr})})
      .then(r => r.json()).then(d => {
        span.classList.add('added');
        flash(d.added ? ('✓ ' + word + ' → в карточки') : (word + ' уже в колоде'));
      }).catch(() => flash('ошибка сети'));
  }

  if(canHover){
    // десктоп: наведение — перевод, клик — в карточки
    textEl.addEventListener('mouseover', e => {
      if(!e.target.classList.contains('w')) return;
      clearTimeout(hideTimer); clearTimeout(showTimer);
      const span = e.target; showTimer = setTimeout(() => showTip(span), 150);
    });
    textEl.addEventListener('mouseout', e => {
      if(!e.target.classList.contains('w')) return;
      clearTimeout(showTimer); hideTimer = setTimeout(hideTip, 220);
    });
    tip.addEventListener('mouseenter', () => clearTimeout(hideTimer));
    tip.addEventListener('mouseleave', () => { hideTimer = setTimeout(hideTip, 220); });
    textEl.addEventListener('click', e => {
      if(e.target.classList.contains('w')) addWord(e.target);
    });
  } else {
    // тач: первый тап — перевод, повторный тап того же слова — в карточки
    textEl.addEventListener('click', e => {
      if(!e.target.classList.contains('w')) return;
      if(shownFor === e.target && cache[e.target.textContent]) addWord(e.target);
      else showTip(e.target);
    });
    document.addEventListener('click', e => {
      if(!tip.hidden && !tip.contains(e.target) && !e.target.classList.contains('w')) hideTip();
    });
  }
})();
</script>
{% endblock %}
