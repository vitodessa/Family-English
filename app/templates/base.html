<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">🌍 {{ app_title }}</a>
    <nav>
      {% if current_user %}
        <a href="/dashboard">Кабинет</a>
        <a href="/lesson">Урок дня</a>
        <a href="/study">Учить</a>
        <a href="/grammar">Грамматика</a>
        <a href="/reading">Чтение</a>
        <a href="/writing">Письмо</a>
        <a href="/listening">Аудирование</a>
        <a href="/video">Видео</a>
        <a href="/speaking">Разговор</a>
        {% if current_user.is_admin %}<a href="/admin">Админ</a>{% endif %}
        <span class="who">{{ current_user.name }}</span>
        <a class="ghost" href="/logout">Выйти</a>
      {% else %}
        <a href="/login">Войти</a>
        <a class="ghost" href="/register">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
<script>
// Лёгкое конфетти без внешних библиотек — для побед и завершения урока.
window.confetti=function(){
  const c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999';
  c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const ctx=c.getContext('2d');
  const cols=['#ff6b6b','#5b4bdb','#2bb673','#f0a92b','#3a8de8','#ff9d2e','#8b5cf6'];
  const P=[]; for(let i=0;i<140;i++)P.push({x:innerWidth*(.3+Math.random()*.4),y:innerHeight*.28,
    vx:(Math.random()-.5)*13,vy:Math.random()*-13-3,g:.42,c:cols[i%cols.length],
    s:Math.random()*7+4,r:Math.random()*6.28,vr:(Math.random()-.5)*.4});
  let t=0;(function loop(){ t++; ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(t<130) requestAnimationFrame(loop); else c.remove(); })();
};
// Звук через Web Audio (без внешних API): весёлая трель на победу.
window.sfx={
  _c:null,
  ctx(){ try{ this._c=this._c||new (window.AudioContext||window.webkitAudioContext)(); return this._c; }catch(e){ return null; } },
  tone(f,t,d){ const c=this.ctx(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.start(t); o.stop(t+d); },
  win(){ const c=this.ctx(); if(!c) return; const n=c.currentTime;
    [523,659,784,1047].forEach((f,i)=>this.tone(f,n+i*0.11,0.18)); }
};
</script>
</body>
</html>
